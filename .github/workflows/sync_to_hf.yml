# OPEN-CAREER-COACH · .github/workflows/sync_to_hf.yml
# Sincronización automática GitHub → Hugging Face Spaces
# Se activa en cada push a main

name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "papayaykware@users.noreply.github.com"
          git config --global user.name "papayaykware"
          git remote add hf https://papayaykware:${HF_TOKEN}@huggingface.co/spaces/papayaykware/OPEN-CAREER-COACH
          git push hf main --force
